<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Argon Mark Construction Grid">
  <title>Argon Mark Construction Grid (128u coordinate system)</title>
  <rect width="256" height="256" fill="#15171B"/>
  <g transform="translate(64 64)">
    <!-- Container and glyph -->
    <rect width="128" height="128" rx="20" fill="#1E1E1E" stroke="#2F333C" stroke-width="1"/>
    <g fill="#FBF8F4">
      <path d="M16 106 56.4 27.5A8.55 8.55 0 0 1 71.6 27.5L112 106H97L64 41.5 31 106Z"/>
      <path d="M50.5 78H77.5L82 87H46Z"/>
    </g>
    <!-- Construction lines -->
    <g stroke="#6478F5" stroke-width="0.75" stroke-dasharray="2 2" fill="none">
      <!-- Outer boundary & symmetry axis -->
      <line x1="64" y1="-20" x2="64" y2="148"/>
      <!-- Top cap y=22.85, Inner vertex y=41.5, Crossbar y=78..87, Baseline y=106 -->
      <line x1="-20" y1="22.85" x2="148" y2="22.85"/>
      <line x1="-20" y1="41.5" x2="148" y2="41.5"/>
      <line x1="-20" y1="78" x2="148" y2="78"/>
      <line x1="-20" y1="87" x2="148" y2="87"/>
      <line x1="-20" y1="106" x2="148" y2="106"/>
      <!-- Foot x boundaries x=16, 31, 97, 112 -->
      <line x1="16" y1="-12" x2="16" y2="140"/>
      <line x1="112" y1="-12" x2="112" y2="140"/>
      <!-- Apex circle r=8.55 at (64, 31.4) -->
      <circle cx="64" cy="31.4" r="8.55" stroke-dasharray="none"/>
      <!-- Corner radius circle r=20 at (20, 20) -->
      <circle cx="20" cy="20" r="20"/>
    </g>
  </g>
</svg>
